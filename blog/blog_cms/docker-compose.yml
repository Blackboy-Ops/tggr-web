services:
  web:
    build: .
    container_name: blog_cms_web
    command: gunicorn blog_cms.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/images
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: blog_cms_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: blog_cms_nginx
    ports:
      - "7788:80"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/images
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
